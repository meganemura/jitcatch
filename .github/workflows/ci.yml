name: CI

on:
  push:
    branches:
      - main
      - queue
  pull_request:
  # release.yml runs the same jobs on the commit it releases.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor runs test/run.rb alone. It needs no gems, and hegeltest
          # needs Ruby 3.4, so no bundle is installed there.
          - ruby: "3.3"
            bundler: none
            property: false
          - ruby: "4.0"
            bundler: Gemfile.lock
            property: true
    # Actions are pinned to a commit. A tag can be moved to another commit,
    # so a tag reference says which version its owner offers today rather
    # than which code this workflow ran last time.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: ${{ matrix.bundler }}
          bundler-cache: ${{ matrix.property }}
      - name: Run the tests
        run: ruby -Ilib test/run.rb
      - name: Run the property tests
        if: ${{ matrix.property }}
        run: bundle exec ruby -Ilib test/property/run.rb
      # test/run.rb runs without the bundle, so there the RSpec engine tests
      # skip. This step runs them on the bundle's rspec-core.
      - name: Run the RSpec engine tests
        if: ${{ matrix.property }}
        run: bundle exec ruby -Ilib test/jitcatch/test_rspec_runner.rb
        env:
          JITCATCH_RSPEC: required

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          # rbs-inline and Steep need Ruby 3.4 or newer.
          ruby-version: "3.4"
          bundler-cache: true
      - name: Write the signatures from lib/
        run: bundle exec rbs-inline --output=sig/generated lib
      # intent-to-add makes a new file that nobody committed show in the diff too.
      - name: Check that the committed signatures are current
        run: git add --intent-to-add sig && git diff --exit-code sig
      - name: Check lib/ with Steep
        run: bundle exec steep check
